services:

  web:
    image: ${WEB_IMAGE:-techstore-web:latest}
    container_name: techstore-dev-web
    ports:
      - "8082:80"

  database:
    image: mysql:8.0
    container_name: techstore-dev-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: techstore
      MYSQL_USER: techstore
      MYSQL_PASSWORD: techstorepassword
    volumes:
      - techstore-dev-db-data:/var/lib/mysql

volumes:
  techstore-dev-db-data:
